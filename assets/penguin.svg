<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Body gradients -->
    <linearGradient id="tuxBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#020617"/>
    </linearGradient>

    <linearGradient id="tuxBelly" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>

    <!-- Beak and feet -->
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>

    <!-- Sunglasses Gradient & Glow -->
    <linearGradient id="shadesLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>

    <linearGradient id="shadesGlare" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="200" cy="200" r="180" fill="url(#bgGlow)" />

  <!-- Shadow below penguin -->
  <ellipse cx="200" cy="370" rx="110" ry="20" fill="#000000" opacity="0.35" />

  <!-- Feet -->
  <ellipse cx="145" cy="355" rx="36" ry="18" fill="url(#orangeGrad)" transform="rotate(-10 145 355)" filter="url(#shadow)"/>
  <ellipse cx="255" cy="355" rx="36" ry="18" fill="url(#orangeGrad)" transform="rotate(10 255 355)" filter="url(#shadow)"/>

  <!-- Flippers (Wings) -->
  <path d="M 120 180 C 70 200, 50 260, 80 290 C 100 310, 125 250, 130 220 Z" fill="url(#tuxBody)" filter="url(#shadow)"/>
  <path d="M 280 180 C 330 200, 350 260, 320 290 C 300 310, 275 250, 270 220 Z" fill="url(#tuxBody)" filter="url(#shadow)"/>

  <!-- Penguin Body -->
  <path d="M 200 65 
           C 130 65, 105 130, 105 210 
           C 105 285, 125 350, 200 350 
           C 275 350, 295 285, 295 210 
           C 295 130, 270 65, 200 65 Z" 
        fill="url(#tuxBody)" filter="url(#shadow)"/>

  <!-- White Belly -->
  <path d="M 200 155 
           C 145 155, 130 205, 130 265 
           C 130 320, 155 342, 200 342 
           C 245 342, 270 320, 270 265 
           C 270 205, 255 155, 200 155 Z" 
        fill="url(#tuxBelly)"/>

  <!-- Beak -->
  <path d="M 178 162 Q 200 195 222 162 Q 200 152 178 162 Z" fill="url(#orangeGrad)" filter="url(#shadow)"/>

  <!-- COOL SUNGLASSES (Snug fit within the head contour, no outward overflow) -->
  <!-- Bridge between lenses -->
  <path d="M 188 135 Q 200 133 212 135" stroke="#0f172a" stroke-width="7" stroke-linecap="round" fill="none"/>

  <!-- Left Frame Rim -->
  <path d="M 136 128 L 188 132 C 190 152, 178 164, 160 164 C 142 164, 134 150, 136 128 Z" 
        fill="#0f172a" stroke="#020617" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Left Lens -->
  <path d="M 140 132 L 184 135 C 186 149, 175 160, 160 160 C 145 160, 138 147, 140 132 Z" 
        fill="url(#shadesLens)"/>
  <!-- Left Lens Glare -->
  <polygon points="144,134 159,135 150,157 142,155" fill="url(#shadesGlare)" opacity="0.8"/>

  <!-- Right Frame Rim -->
  <path d="M 212 132 L 264 128 C 266 150, 258 164, 240 164 C 222 164, 210 152, 212 132 Z" 
        fill="#0f172a" stroke="#020617" stroke-width="4" stroke-linejoin="round" filter="url(#shadow)"/>
  <!-- Right Lens -->
  <path d="M 216 135 L 260 132 C 262 147, 255 160, 240 160 C 225 160, 214 149, 216 135 Z" 
        fill="url(#shadesLens)"/>
  <!-- Right Lens Glare -->
  <polygon points="224,136 239,135 230,157 222,155" fill="url(#shadesGlare)" opacity="0.8"/>

  <!-- Temples (Tucked cleanly within the head silhouette) -->
  <path d="M 136 132 Q 128 132 122 136" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
  <path d="M 264 132 Q 272 132 278 136" stroke="#0f172a" stroke-width="5" stroke-linecap="round" fill="none"/>
</svg>
